<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Shorts Blacklist</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      color: #0f0f0f;
      margin: 0;
      padding: 32px 20px;
    }
    .wrap { max-width: 720px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .subtitle { color: #777; font-size: 13px; margin: 0 0 24px; }
    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 18px;
      margin-bottom: 18px;
    }
    .card h2 { font-size: 14px; margin: 0 0 12px; }
    .row { display: flex; gap: 8px; align-items: center; }
    input[type="text"], input[type="number"] {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"] { flex: 1; }
    input[type="number"] { width: 80px; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      background: #555;
      color: #fff;
    }
    button.primary { background: #cc0000; }
    button:hover { opacity: 0.9; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid #f0f0f0;
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 13px;
    }
    li .idx { color: #aaa; font-size: 11px; margin-right: 10px; }
    .delete-btn {
      background: none;
      color: #888;
      border: none;
      font-size: 15px;
      padding: 2px 6px;
    }
    .delete-btn:hover { color: #cc0000; }
    .empty-msg { color: #777; font-size: 13px; padding: 16px 0; text-align: center; }
    .row-right { display: flex; align-items: center; gap: 12px; }
    .added-at { color: #999; font-size: 12px; white-space: nowrap; }
    .hint { color: #888; font-size: 12px; margin: 8px 0 0; line-height: 1.6; }
    .setting-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .count { color: #777; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 data-i18n="manageTitle"></h1>
    <p class="subtitle" data-i18n="manageSubtitle"></p>

    <div class="card">
      <h2 data-i18n="addSectionTitle"></h2>
      <div class="row">
        <input type="text" id="addInput" data-i18n-placeholder="managePlaceholder" />
        <button id="addBtn" class="primary" data-i18n="add"></button>
      </div>
    </div>

    <div class="card">
      <h2><span data-i18n="listSectionTitle"></span> <span id="count" class="count"></span></h2>
      <div class="row">
        <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" />
        <select id="sortSelect">
          <option value="recent" data-i18n="sortRecent"></option>
          <option value="oldest" data-i18n="sortOldest"></option>
          <option value="nameAsc" data-i18n="sortNameAsc"></option>
          <option value="nameDesc" data-i18n="sortNameDesc"></option>
        </select>
      </div>
      <ul id="list"></ul>
    </div>

    <div class="card">
      <h2 data-i18n="displaySettings"></h2>
      <div class="row">
        <label for="recentCountInput" data-i18n="recentCountLabel"></label>
        <input type="number" id="recentCountInput" min="1" max="100" />
        <button id="saveCountBtn" data-i18n="save"></button>
        <span id="saveMsg" class="count"></span>
      </div>
      <p class="hint" data-i18n="recentCountHint"></p>

      <div class="setting-row" style="margin-top:16px;">
        <input type="checkbox" id="blockAdsToggle" />
        <label for="blockAdsToggle" data-i18n="blockAdsLabel"></label>
      </div>
      <p class="hint" data-i18n="blockAdsDesc"></p>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="manage.js"></script>
</body>
</html>
